version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk_pg
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespass
      POSTGRES_DB: helpdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
